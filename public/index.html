<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cruise search</title>
<link rel="icon" type="image/png" href="/favicon-light-mode.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/favicon-dark-mode.png" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #16202b;
    --muted: #63707e;
    --line: #e2e6ea;
    --accent: #0b6d8f;
    --accent-ink: #ffffff;
    --chip: #eef2f5;
    --warn-bg: #fff6e5;
    --warn-line: #e8c384;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,32,43,.06), 0 8px 24px rgba(16,32,43,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1418; --panel: #161d23; --ink: #e8edf1; --muted: #9aa8b4;
      --line: #26313a; --accent: #4bb3d4; --accent-ink: #06222d; --chip: #1e272f;
      --warn-bg: #2c2415; --warn-line: #6b5426;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 18px 24px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  h1 { margin: 0 0 2px; font-size: 20px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  form { display: flex; gap: 10px; margin-top: 14px; }
  input[type=search] {
    flex: 1; padding: 13px 16px; font-size: 16px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 13px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
  }
  button:disabled { opacity: .55; cursor: progress; }
  .examples { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button {
    background: var(--chip); color: var(--muted); font-weight: 500;
    padding: 6px 12px; font-size: 13px; border-radius: 999px;
  }
  main { max-width: 1280px; margin: 0 auto; padding: 22px 24px 60px; }

  .understood {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 20px; box-shadow: var(--shadow);
  }
  .understood h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); }
  .understood p { margin: 0 0 10px; font-size: 15px; }
  pre {
    margin: 0; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; overflow-x: auto; font-size: 12.5px; line-height: 1.55;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
  }
  .filter-json summary { cursor: pointer; font-size: 13px; color: var(--muted); margin: 6px 0; }
  .filter-json[open] summary { margin-bottom: 8px; }
  .warn {
    background: var(--warn-bg); border: 1px solid var(--warn-line);
    border-radius: 10px; padding: 10px 13px; margin-bottom: 10px; font-size: 14px;
  }

  .years { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .yearchip {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    padding: 8px 14px; font-size: 14px; font-weight: 600; border-radius: 999px;
  }
  .yearchip:hover { border-color: var(--accent); }
  .yearchip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .yearcount {
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
    background: var(--chip); color: var(--muted); font-size: 12px; font-weight: 600;
  }
  .yearchip.on .yearcount { background: rgba(255,255,255,.22); color: inherit; }

  .facets { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; margin-bottom: 20px; }
  .facet label { display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted); margin-bottom: 5px; }
  select, input[type=range] {
    padding: 8px 10px; font-size: 14px; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  input[type=range] { padding: 0; width: 170px; accent-color: var(--accent); }
  .count { margin-left: auto; color: var(--muted); font-size: 14px; }

  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(16,32,43,.1), 0 16px 40px rgba(16,32,43,.12); }
  .thumb { position: relative; aspect-ratio: 16/10; background: var(--chip); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* No photo from the line (Celebrity lists some itineraries with none), or one that failed. */
  .no-photo {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px;
  }
  .nights {
    position: absolute; left: 12px; top: 12px; background: rgba(6,20,28,.82); color: #fff;
    font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
    backdrop-filter: blur(4px);
  }
  .tour {
    position: absolute; left: 12px; top: 44px; background: var(--accent); color: var(--accent-ink);
    font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
  }
  .viewed {
    position: absolute; right: 12px; top: 12px; background: rgba(6,20,28,.82); color: #fff;
    font: 600 12px/normal inherit; padding: 5px 10px; border-radius: 999px; border: 0; cursor: pointer;
  }
  .viewed:hover, .viewed:focus-visible { background: rgba(6,20,28,.95); }
  .stars { display: flex; gap: 2px; }
  .stars .star { background: none; border: 0; padding: 0 1px; font-size: 19px; line-height: 1;
    color: var(--muted); cursor: pointer; }
  .stars .star.on { color: #e8a317; }
  .stars .star:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
  .card.unlisted { filter: grayscale(.7); opacity: .72; }
  .card.unlisted:hover, .card.unlisted:focus-within { opacity: 1; }
  .gone {
    position: absolute; left: 12px; top: 44px; background: #6b7580; color: #fff;
    font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
  }
  /* Above the cards: what this list is (and the table link, on My cruises), and its count. */
  .results-bar { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;
    min-height: 20px; font-size: 14px; color: var(--muted); }
  .table-link { font-weight: 600; color: var(--accent); text-decoration: none; }
  .table-link:hover { text-decoration: underline; }
  /* My cruises is your list; the chips after it are years. */
  .chip-divider { width: 1px; align-self: stretch; margin: 4px 4px; background: var(--line); }
  .panel .hero-text .stars { margin-top: 6px; }
  .panel .hero-text .star { color: rgba(255,255,255,.75); }
  .panel .hero-text .star.on { color: #ffc940; }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .title { font-size: 16px; font-weight: 650; line-height: 1.3; letter-spacing: -.01em; }
  .meta { font-size: 13px; color: var(--muted); }
  .ports { font-size: 12.5px; color: var(--muted); }
  .foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line);
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .price { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  .price small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .cabin { font-size: 12px; color: var(--muted); text-transform: capitalize; }
  a.book { color: var(--accent); font-size: 13px; font-weight: 600; text-decoration: none; }
  a.book:hover { text-decoration: underline; }
  .flights-btn { background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 10px; font: inherit; font-size: 13px; font-weight: 600; color: var(--accent); cursor: pointer; }
  /* Flights panel. It stays in the page and slides: `hidden` (display: none) can't animate.
     Closed, it waits off-screen and invisible; visibility flips only after the slide out. */
  .panel-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(6,20,28,.45);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s .25s; }
  .panel-backdrop.open { opacity: 1; visibility: visible; transition: opacity .35s ease; }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; width: min(570px, 100vw);
    background: var(--panel); box-shadow: -30px 0 80px rgba(6,20,28,.30);
    overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column;
    transform: translateX(104%); visibility: hidden;
    transition: transform .25s cubic-bezier(.55,0,1,.45), visibility 0s .25s; }
  .panel.open { transform: none; visibility: visible; transition: transform .45s cubic-bezier(.16,1,.3,1); }

  .panel .hero { position: relative; flex: none; height: 210px; overflow: hidden; color: #fff;
    background: linear-gradient(135deg, #0b6d8f, #0a3d55 60%, #06222d); }
  .panel .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transform: scale(1.08); transition: transform 1.4s cubic-bezier(.16,1,.3,1); }
  .panel.open .hero img { transform: none; }
  .panel .hero::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(4,16,24,.88), rgba(4,16,24,.25) 55%, rgba(4,16,24,.1)); }
  .panel .hero-text { position: absolute; left: 24px; right: 24px; bottom: 18px; z-index: 1; }
  .panel .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .panel h2 { margin: 4px 0 2px; font-size: 22px; line-height: 1.25; text-shadow: 0 1px 12px rgba(0,0,0,.35); }
  .panel .hero-meta { font-size: 14px; opacity: .9; }
  .panel .close { position: absolute; top: 14px; right: 14px; z-index: 2; width: 36px; height: 36px;
    /* Padding 0 and centred: the page's button padding made it a 44×36 oval. */
    display: grid; place-items: center; padding: 0; line-height: 1;
    border-radius: 50%; border: 0; cursor: pointer; font-size: 16px; color: #fff;
    background: rgba(4,16,24,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background .2s, transform .2s; }
  .panel .close:hover { background: rgba(4,16,24,.7); transform: rotate(90deg); }

  .panel-body { padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 18px; }
  .home { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
  .panel .home input { width: 4.2em; font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; text-align: center; color: var(--ink); background: var(--chip);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }
  .panel .home input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .flights { display: flex; flex-direction: column; gap: 18px; }

  .legs { display: flex; flex-direction: column; gap: 10px; }
  .leg { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
  .leg-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .leg-route { display: flex; align-items: center; margin-top: 4px; }
  .leg .stop { display: flex; flex-direction: column; min-width: 0; }
  .leg .stop.end { text-align: right; }
  .leg .stop b { font-size: 22px; letter-spacing: .04em; }
  .leg .stop span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .leg .path { flex: 1; position: relative; margin: 0 14px; border-top: 2px dashed var(--line); }
  .leg .path span { position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    padding: 0 6px; background: var(--panel); color: var(--accent); font-size: 16px; line-height: 1;
    animation: fly .9s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--i, 0) * 70ms + 120ms); }
  @keyframes fly { from { left: 8%; opacity: 0; } to { left: 50%; opacity: 1; } }

  .fare { border-radius: var(--radius); padding: 18px 20px; color: var(--ink);
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--panel)),
      color-mix(in srgb, var(--accent) 4%, var(--panel))); border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); }
  .fare-label { font-size: 13px; color: var(--muted); }
  .fare-amount { font-size: 38px; font-weight: 800; line-height: 1.1; color: var(--accent); letter-spacing: -.01em; }
  .fare-amount small { font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .fare-total { display: inline-block; margin-top: 10px; padding: 5px 12px; border-radius: 999px; font-size: 14px;
    background: var(--panel); border: 1px solid var(--line); }
  .fare-total b { color: var(--ink); }
  .fare-note { margin-top: 8px; font-size: 12px; color: var(--muted); }

  .options-head { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .options { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .option { display: grid; grid-template-columns: 5.5em 1fr auto auto; gap: 4px 14px; align-items: baseline;
    padding: 10px 16px; font-size: 14px; border-top: 1px solid var(--line); transition: background .15s; }
  .option:first-child { border-top: 0; }
  .option:hover { background: var(--chip); }
  .option .o-price { font-weight: 700; }
  .option .o-air { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .option .o-when, .option .o-stops { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .option.best .o-price { color: var(--accent); }
  .panel-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .gflights { display: inline-block; padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
    text-decoration: none; color: var(--accent-ink); background: var(--accent); transition: filter .15s, transform .15s; }
  .gflights:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .panel .note { font-size: 13px; color: var(--muted); }
  .panel .message { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; font-size: 15px; }

  /* Each block rises in after the one before (--i is its place in line). */
  .rise { animation: rise .5s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--i, 0) * 70ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  /* While searching: a shimmering outline of the answer to come. */
  .sk { border-radius: var(--radius); background: linear-gradient(90deg, var(--chip) 25%,
      color-mix(in srgb, var(--chip) 40%, var(--panel)) 50%, var(--chip) 75%);
    background-size: 300% 100%; animation: shimmer 1.4s linear infinite; }
  .sk-leg { height: 74px; } .sk-fare { height: 116px; } .sk-row { height: 40px; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -200% 0; } }

  @media (max-width: 600px) {
    /* On a phone the divider becomes a line break: My cruises on a line of its own. */
    .chip-divider { flex-basis: 100%; height: 0; margin: 0; background: none; }
    .panel .hero { height: 170px; }
    .panel-body { padding: 16px 16px 24px; }
    /* Price | airline on one line; time and stops beneath the airline. */
    .option { grid-template-columns: 4.5em 1fr auto; }
    .option .o-air { grid-column: 2 / -1; }
    .option .o-when { grid-column: 2; }
  }
  @media (prefers-reduced-motion: reduce) {
    .panel, .panel.open, .panel-backdrop, .panel-backdrop.open, .panel .hero img { transition: none; }
    .rise, .leg .path span, .sk { animation: none; }
  }
  .more { display: flex; justify-content: center; align-items: center; gap: 12px;
    padding: 20px 0 48px; color: var(--muted); font-size: 14px; }
  .more[hidden] { display: none; }
  .more button { font: inherit; font-size: 13px; font-weight: 600; color: var(--accent); cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; }
  .empty { text-align: center; padding: 70px 20px; color: var(--muted); font-size: 17px; }
  .account { position: absolute; top: 14px; right: 16px; font-size: 14px; }
  .account a { color: var(--accent); text-decoration: none; }
  header .wrap { position: relative; }
  .refresh { font: inherit; font-size: 13px; font-weight: 600; padding: 4px 10px; border: 1px solid var(--line);
    border-radius: 999px; background: transparent; color: var(--accent); cursor: pointer; }
  .refresh-panel { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: -4px 0 14px; }
  .refresh-lines { margin: 0; max-height: 220px; overflow: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; color: var(--muted); }
  .refresh-result { margin-top: 8px; font-size: 14px; }
  .refresh-result div + div { color: var(--muted); font-size: 13px; }
  .refresh-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .refresh-actions button { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Cruise search</h1>
    <div id="account" class="account"></div>
    <div id="mirror-note" class="sub mirror-note" hidden></div>
    <div class="sub" id="sub">Loading…</div>
    <form id="form">
      <input id="q" type="search" autocomplete="off"
             placeholder="a 4-night Bahamas balcony under $700 leaving from Miami">
      <button id="go" type="submit">Search</button>
    </form>
    <div class="examples" id="examples"></div>
  </div>
</header>

<main>
  <div id="understood" class="understood" hidden></div>

  <div id="years"></div>

  <div class="facets" id="facets"></div>

  <div id="results-bar" class="results-bar"><button id="refresh" type="button" class="refresh" hidden>Refresh data</button><span id="results-note"></span><span id="count" class="count"></span></div>
  <section id="refresh-panel" class="refresh-panel" hidden aria-live="polite">
    <pre id="refresh-lines" class="refresh-lines"></pre>
    <div id="refresh-result" class="refresh-result"></div>
    <div class="refresh-actions">
      <button id="refresh-new" type="button" hidden>Show the new data</button>
      <button id="refresh-retry" type="button" hidden>Try again</button>
      <button id="refresh-stop" type="button" hidden>Stop</button>
      <button id="refresh-hide" type="button">Hide</button>
    </div>
  </section>
  <div id="results" class="grid"></div>
  <div id="more" class="more" hidden><span id="more-count"></span>
    <button id="show-all" type="button">Show all</button></div>
  <div id="panel-backdrop" class="panel-backdrop"></div>
  <aside id="panel" class="panel" role="dialog" aria-label="Flights"></aside>
</main>

<script type="module" src="/index.js"></script>
</body>
</html>
